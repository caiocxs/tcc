<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="700" height="460" fill="#ffffff"/>

  <!-- Title -->
  <text x="350" y="24" text-anchor="middle" font-size="17" font-weight="700" fill="#0b0b0b">Recall por semente — CWE-415 (configuração de referência)</text>
  <text x="350" y="42" text-anchor="middle" font-size="12" fill="#525142">Combo D, formato yaml, example_mode=graph — nenhuma semente aprovada pelo gate</text>

  <!-- Horizontal gridlines -->
  <g stroke="#e1e0d9" stroke-width="1">
    <line x1="70" y1="290" x2="660" y2="290"/>
    <line x1="70" y1="240" x2="660" y2="240"/>
    <line x1="70" y1="190" x2="660" y2="190"/>
    <line x1="70" y1="140" x2="660" y2="140"/>
    <line x1="70" y1="90"  x2="660" y2="90"/>
  </g>

  <!-- Y axis labels -->
  <g font-size="11" fill="#52514e" text-anchor="end">
    <text x="60" y="344">0%</text>
    <text x="60" y="294">20%</text>
    <text x="60" y="244">40%</text>
    <text x="60" y="194">60%</text>
    <text x="60" y="144">80%</text>
    <text x="60" y="94">100%</text>
  </g>

  <!-- Reference line: traditional rule 28,7% (dotted) -->
  <line x1="70" y1="268.25" x2="660" y2="268.25" stroke="#52514e" stroke-width="1.5" stroke-dasharray="2,3"/>
  <!-- Reference line: gate floor 50% (dashed) -->
  <line x1="70" y1="215" x2="660" y2="215" stroke="#0b0b0b" stroke-width="1.5" stroke-dasharray="7,4"/>

  <!-- Axis baseline -->
  <line x1="70" y1="340" x2="660" y2="340" stroke="#c3c2b7" stroke-width="1.2"/>

  <!-- Bars -->
  <!-- Seed 1: 63,8% -->
  <rect x="99"  y="180.5"  width="60" height="159.5" fill="#2a78d6"/>
  <text x="129" y="172.5" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">63,8%</text>
  <text x="129" y="358" text-anchor="middle" font-size="11" fill="#52514e">Semente 1</text>

  <!-- Seed 2: 64,8% -->
  <rect x="217" y="178.0"  width="60" height="162.0" fill="#2a78d6"/>
  <text x="247" y="170.0" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">64,8%</text>
  <text x="247" y="358" text-anchor="middle" font-size="11" fill="#52514e">Semente 2</text>

  <!-- Seed 3: 47,3% -->
  <rect x="335" y="221.75" width="60" height="118.25" fill="#eb6834"/>
  <text x="365" y="213.75" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">47,3%</text>
  <text x="365" y="358" text-anchor="middle" font-size="11" fill="#52514e">Semente 3</text>

  <!-- Seed 4: 43,3% -->
  <rect x="453" y="231.75" width="60" height="108.25" fill="#eb6834"/>
  <text x="483" y="223.75" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">43,3%</text>
  <text x="483" y="358" text-anchor="middle" font-size="11" fill="#52514e">Semente 4</text>

  <!-- Seed 5: 76,3% -->
  <rect x="571" y="149.25" width="60" height="190.75" fill="#2a78d6"/>
  <text x="601" y="141.25" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">76,3%</text>
  <text x="601" y="358" text-anchor="middle" font-size="11" fill="#52514e">Semente 5</text>

  <!-- Legend -->
  <g font-size="11" fill="#52514e">
    <rect x="70"  y="400" width="16" height="16" fill="#2a78d6"/>
    <text x="92" y="412">Recall &#8805; 50%</text>
    <rect x="220" y="400" width="16" height="16" fill="#eb6834"/>
    <text x="242" y="412">Recall &lt; 50%</text>
    <line x1="370" y1="408" x2="400" y2="408" stroke="#0b0b0b" stroke-width="1.5" stroke-dasharray="7,4"/>
    <text x="406" y="412">Piso do gate (50%)</text>
    <line x1="530" y1="408" x2="560" y2="408" stroke="#52514e" stroke-width="1.5" stroke-dasharray="2,3"/>
    <text x="566" y="412">Regra tradicional</text>
  </g>

  <text x="350" y="440" text-anchor="middle" font-size="11.5" fill="#898781">Amplitude de 33 pontos percentuais entre a maior e a menor semente (Tabela — Recall por semente, CWE-415)</text>
</svg>
